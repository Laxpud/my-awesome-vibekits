name: Plugin validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify catalog-generated metadata
        run: python scripts/sync_plugin_metadata.py
      - name: Verify Codex marketplace install paths
        run: python scripts/check_codex_install.py --all
      - name: Verify Markdown links and whitespace
        run: |
          python scripts/check_markdown_links.py
          git diff --check

      - name: Run marketplace catalog tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
